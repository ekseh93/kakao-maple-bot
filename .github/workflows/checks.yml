name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm policy:check
      - run: pnpm phone:check
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lambda:dry-run
      - name: Secret scan
        run: git grep -n -I -E '(NEXON_API_KEY=.{8,}|KIS_APP_SECRET=.{8,}|Bearer [A-Za-z0-9_-]{20,})' -- ':!pnpm-lock.yaml' && exit 1 || true
