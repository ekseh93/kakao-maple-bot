name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [quality, security, test-build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Formatting, lint, and relay syntax
        if: matrix.suite == 'quality'
        run: |
          pnpm format:check
          pnpm lint
          pnpm phone:check
          pnpm phone:test
          pnpm pc-deals:check
      - name: Policy, secret scanner, and dependencies
        if: matrix.suite == 'security'
        run: |
          pnpm policy:check
          pnpm secret:test
          pnpm secret:check
          pnpm audit
      - name: Types, regression tests, and Lambda bundle
        if: matrix.suite == 'test-build'
        run: |
          pnpm typecheck
          pnpm test
          pnpm lambda:dry-run
  verify:
    name: verify
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed
        env:
          SUITE_RESULT: ${{ needs.checks.result }}
        run: test "$SUITE_RESULT" = "success"
