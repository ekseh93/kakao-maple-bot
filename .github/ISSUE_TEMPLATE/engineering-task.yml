name: Engineering task
description: Plan a feature, refactoring, documentation, or operational improvement.
title: ''
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the engineering problem before proposing an implementation. Do not include secrets, real room names, user identifiers, or private chat captures.

  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: What problem is being solved, for whom, and why now?
      placeholder: Explain the current limitation and its impact.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the intended changes and the components that may be affected.
      placeholder: |
        - In scope:
        - Affected paths:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable completion conditions.
      placeholder: |
        - [ ] Normal, boundary, and error cases are covered.
        - [ ] Documentation and runtime help are updated when behavior changes.
        - [ ] Evidence boundaries are explicit.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and non-goals
      description: Record security, privacy, cost, provider-policy, and deployment boundaries.
      placeholder: |
        Risks:
        Non-goals:
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Separate repository checks, AWS observations, and user-device E2E.
      placeholder: |
        Repository:
        AWS (if applicable):
        Android/KakaoTalk (if applicable):
    validations:
      required: true
